# -------------------------
# Reserva
# -------------------------
  /reservas:
    get:
      tags:
        - Reserva
      summary: Listar todas as reservas
      responses:
        '200':
          description: Lista de reservas
        '500':
          description: Erro interno do servidor
    post:
      tags:
        - Reserva
      summary: Criar uma reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: string
                  format: date
                id_cliente:
                  type: integer
                id_espaco:
                  type: integer
                id_adm:
                  type: integer
      responses:
        '201':
          description: Reserva criada
        '400':
          description: Requisição inválida
        '500':
          description: Erro interno do servidor

  /reservas/{id}:
    get:
      tags:
        - Reserva
      summary: Obter reserva pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID da reserva
          schema:
            type: integer
      responses:
        '200':
          description: Reserva encontrada
        '404':
          description: Reserva não encontrada
        '500':
          description: Erro interno do servidor
    put:
      tags:
        - Reserva
      summary: Atualizar reserva
      parameters:
        - name: id
          in: path
          required: true
          description: ID da reserva
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: string
                  format: date
                id_cliente:
                  type: integer
                id_espaco:
                  type: integer
                id_adm:
                  type: integer
      responses:
        '200':
          description: Reserva atualizada
        '404':
          description: Reserva não encontrada
        '500':
          description: Erro interno do servidor
    delete:
      tags:
        - Reserva
      summary: Deletar reserva
      parameters:
        - name: id
          in: path
          required: true
          description: ID da reserva
          schema:
            type: integer
      responses:
        '204':
          description: Reserva removida
        '404':
          description: Reserva não encontrada
        '500':
          description: Erro interno do servidor

# -------------------------
# Pagamento
# -------------------------
  /pagamentos:
    get:
      tags:
        - Pagamento
      summary: Listar todos os pagamentos
      responses:
        '200':
          description: Lista de pagamentos
        '500':
          description: Erro interno do servidor
    post:
      tags:
        - Pagamento
      summary: Criar pagamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                valortotal:
                  type: number
                valorpago:
                  type: number
                tipopagamento:
                  type: string
                id_reserva:
                  type: integer
      responses:
        '201':
          description: Pagamento criado
        '400':
          description: Erro ao criar pagamento

  /pagamentos/{id}:
    get:
      tags:
        - Pagamento
      summary: Obter pagamento pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do pagamento
          schema:
            type: integer
      responses:
        '200':
          description: Pagamento encontrado
        '404':
          description: Pagamento não encontrado
        '500':
          description: Erro interno do servidor
    put:
      tags:
        - Pagamento
      summary: Atualizar pagamento
      parameters:
        - name: id
          in: path
          required: true
          description: ID do pagamento
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                valortotal:
                  type: number
                valorpago:
                  type: number
                tipopagamento:
                  type: string
                id_reserva:
                  type: integer
      responses:
        '200':
          description: Pagamento atualizado
        '404':
          description: Pagamento não encontrado
        '400':
          description: Erro ao atualizar pagamento
    delete:
      tags:
        - Pagamento
      summary: Deletar pagamento
      parameters:
        - name: id
          in: path
          required: true
          description: ID do pagamento
          schema:
            type: integer
      responses:
        '204':
          description: Pagamento removido
        '404':
          description: Pagamento não encontrado
        '500':
          description: Erro interno do servidor
