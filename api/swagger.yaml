          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                descricao:
                  type: string
                capacidade:
                  type: integer
                preco:
                  type: number
                tipo:
                  type: string
                diasindisponiveis:
                  type: array
                  items:
                    type: string
                    format: date
      responses:
        '200':
          description: Espaço atualizado
        '404':
          description: Espaço não encontrado
        '500':
          description: Erro interno do servidor
    delete:
      tags:
        - Espaço
      summary: Deletar espaço
      parameters:
        - name: id
          in: path
          required: true
          description: ID do espaço
          schema:
            type: integer
      responses:
        '204':
          description: Espaço removido
        '404':
