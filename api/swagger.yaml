# -------------------------
# Espaço
# -------------------------
  /espacos:
    post:
      tags:
        - Espaço
      summary: Criar espaço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - capacidade
                - preco
              properties:
                nome:
                  type: string
                descricao:
                  type: string
                capacidade:
                  type: integer
                preco:
                  type: number
                tipo:
                  type: string
                diasindisponiveis:
                  type: array
                  items:
                    type: string
                    format: date
      responses:
        '201':
          description: Espaço criado
        '400':
          description: Requisição inválida
        '500':
          description: Erro interno do servidor
    get:
      tags:
        - Espaço
      summary: Listar todos os espaços
      responses:
        '200':
          description: Lista de espaços
        '404':
          description: Nenhum espaço encontrado
        '500':
          description: Erro interno do servidor

  /espacos/{id}:
    get:
      tags:
        - Espaço
      summary: Buscar espaço pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do espaço
          schema:
            type: integer
      responses:
        '200':
          description: Espaço encontrado
        '404':
          description: Espaço não encontrado
        '500':
          description: Erro interno do servidor
    put:
      tags:
        - Espaço
      summary: Atualizar espaço
      parameters:
        - name: id
