openapi: "3.0.3"
info:
  title: API Cantinho Dona Maria
  version: "1.0.0"
  description: API para gerenciamento de ADMs, Clientes, Espaços, Reservas e Pagamentos
servers:
  - url: http://localhost:3000

tags:
  - name: ADM
    description: Operações relacionadas aos administradores
  - name: Cliente
    description: Operações relacionadas aos clientes
  - name: Espaço
    description: Operações relacionadas aos espaços
  - name: Reserva
    description: Operações relacionadas às reservas
  - name: Pagamento
    description: Operações relacionadas aos pagamentos

paths:

  /adm:
    get:
      tags:
        - ADM
      summary: Listar todos os ADMs
      responses:
        '200':
          description: Lista de ADMs
        '404':
          description: Nenhum ADM encontrado
        '500':
          description: Erro interno do servidor
    post:
      tags:
        - ADM
      summary: Criar um novo ADM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - cpf
              properties:
                nome:
                  type: string
                  description: Nome completo do ADM
                cpf:
                  type: integer
                  description: CPF do ADM
                datanasc:
                  type: string
                  format: date
                  description: Data de nascimento do ADM
      responses:
        '201':
          description: ADM criado com sucesso
        '400':
          description: Requisição inválida
        '500':
          description: Erro interno do servidor

  /adm/{id}:
    get:
      tags:
        - ADM
      summary: Buscar um ADM pelo ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID do ADM
          schema:
            type: integer
      responses:
        '200':
          description: ADM encontrado
        '404':
          description: ADM não encontrado
        '500':
          description: Erro interno do servidor
    put:
      tags:
        - ADM
      summary: Atualizar ADM
      parameters:
        - name: id
          in: path
          required: true
          description: ID do ADM
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                cpf:
                  type: integer
                datanasc:
                  type: string
                  format: date
      responses:
        '200':
          description: ADM atualizado
        '404':
          description: ADM não encontrado
        '500':
          description: Erro interno do servidor
    delete:
      tags:
        - ADM
      summary: Deletar ADM
      parameters:
        - name: id
          in: path
          required: true
          description: ID do ADM
          schema:
            type: integer
      responses:
        '204':
          description: ADM removido
        '404':
          description: ADM não encontrado
        '500':
          description: Erro interno do servidor

