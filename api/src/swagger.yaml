openapi: "3.0.3"
info:
  title: API Cantinho Dona Maria
  version: "1.0.0"
  description: API para gerenciamento de ADM, Clientes, Espaços, Reservas e Pagamentos
servers:
  - url: http://localhost:3000

paths:
  /adm/create:
    post:
      summary: Criar um novo ADM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - cpf
              properties:
                nome:
                  type: string
                cpf:
                  type: integer
                datanasc:
                  type: string
                  format: date
      responses:
        '201':
          description: ADM criado com sucesso
        '400':
          description: Requisição inválida
        '500':
          description: Erro interno do servidor

  /adm/all:
    get:
      summary: Listar todos os ADMs
      responses:
        '200':
          description: Lista de ADMs
        '404':
          description: Nenhum ADM encontrado
        '500':
          description: Erro interno do servidor

  /adm/getOne/{id}:
    get:
      summary: Buscar um ADM pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: ADM encontrado
        '404':
          description: ADM não encontrado
        '500':
          description: Erro interno do servidor

  /adm/update/{id}:
    put:
      summary: Atualizar ADM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                cpf:
                  type: integer
                datanasc:
                  type: string
                  format: date
      responses:
        '200':
          description: ADM atualizado
        '404':
          description: ADM não encontrado
        '500':
          description: Erro interno do servidor

  /adm/delete/{id}:
    delete:
      summary: Deletar ADM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: ADM removido
        '404':
          description: ADM não encontrado
        '500':
          description: Erro interno do servidor

  /clients/create:
    post:
      summary: Criar cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
                - cpf
              properties:
                nome:
                  type: string
                cpf:
                  type: integer
                datanasc:
                  type: string
                  format: date
      responses:
        '201':
          description: Cliente criado
        '400':
          description: Requisição inválida
        '500':
          description: Erro interno do servidor

  /clients/all:
    get:
      summary: Listar todos os clientes
      responses:
        '200':
          description: Lista de clientes
        '404':
          description: Nenhum cliente encontrado
        '500':
          description: Erro interno do servidor

  /clients/getOne/{id}:
    get:
      summary: Buscar cliente pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente encontrado
        '404':
          description: Cliente não encontrado
        '500':
          description: Erro interno do servidor

  /clients/update/{id}:
    put:
      summary: Atualizar cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                cpf:
                  type: integer
                datanasc:
                  type: string
                  format: date
      responses:
        '200':
          description: Cliente atualizado
        '404':
          description: Cliente não encontrado
        '500':
          description: Erro interno do servidor

  /clients/delete/{id}:
    delete:
      summary: Deletar cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Cliente removido
        '404':
          description: Cliente não encontrado
        '500':
          description: Erro interno do servidor

  /espaco/create:
    post:
      summary: Criar espaço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - capacidade
                - preco
              properties:
                nome:
                  type: string
                descricao:
                  type: string
                capacidade:
                  type: integer
                preco:
                  type: number
                tipo:
                  type: string
                diasindisponiveis:
                  type: array
                  items:
                    type: string
                    format: date
      responses:
        '201':
          description: Espaço criado
        '400':
          description: Requisição inválida
        '500':
          description: Erro interno do servidor

  /espaco/all:
    get:
      summary: Listar todos os espaços
      responses:
        '200':
          description: Lista de espaços
        '404':
          description: Nenhum espaço encontrado
        '500':
          description: Erro interno do servidor

  /espaco/getOne/{id}:
    get:
      summary: Buscar espaço pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Espaço encontrado
        '404':
          description: Espaço não encontrado
        '500':
          description: Erro interno do servidor

  /espaco/update/{id}:
    put:
      summary: Atualizar espaço
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                descricao:
                  type: string
                capacidade:
                  type: integer
                preco:
                  type: number
                tipo:
                  type: string
                diasindisponiveis:
                  type: array
                  items:
                    type: string
                    format: date
      responses:
        '200':
          description: Espaço atualizado
        '404':
          description: Espaço não encontrado
        '500':
          description: Erro interno do servidor

  /espaco/delete/{id}:
    delete:
      summary: Deletar espaço
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Espaço removido
        '404':
          description: Espaço não encontrado
        '500':
          description: Erro interno do servidor

  /reservas:
    get:
      summary: Listar todas as reservas
      responses:
        '200':
          description: Lista de reservas
        '500':
          description: Erro interno do servidor
    post:
      summary: Criar uma reserva
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: string
                  format: date
                id_cliente:
                  type: integer
                id_espaco:
                  type: integer
                id_adm:
                  type: integer
      responses:
        '201':
          description: Reserva criada
        '400':
          description: Requisição inválida
        '500':
          description: Erro interno do servidor

  /reservas/{id}:
    get:
      summary: Obter reserva pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reserva encontrada
        '404':
          description: Reserva não encontrada
        '500':
          description: Erro interno do servidor
    put:
      summary: Atualizar reserva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: string
                  format: date
                id_cliente:
                  type: integer
                id_espaco:
                  type: integer
                id_adm:
                  type: integer
      responses:
        '200':
          description: Reserva atualizada
        '404':
          description: Reserva não encontrada
        '500':
          description: Erro interno do servidor
    delete:
      summary: Deletar reserva
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Reserva removida
        '404':
          description: Reserva não encontrada
        '500':
          description: Erro interno do servidor

  /pagamentos:
    get:
      summary: Listar todos os pagamentos
      responses:
        '200':
          description: Lista de pagamentos
        '500':
          description: Erro interno do servidor
    post:
      summary: Criar pagamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                valortotal:
                  type: number
                valorpago:
                  type: number
                tipopagamento:
                  type: string
                id_reserva:
                  type: integer
      responses:
        '201':
          description: Pagamento criado
        '400':
          description: Erro ao criar pagamento

  /pagamentos/{id}:
    get:
      summary: Obter pagamento pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pagamento encontrado
        '404':
          description: Pagamento não encontrado
        '500':
          description: Erro interno do servidor
    put:
      summary: Atualizar pagamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                valortotal:
                  type: number
                valorpago:
                  type: number
                tipopagamento:
                  type: string
                id_reserva:
                  type: integer
      responses:
        '200':
          description: Pagamento atualizado
        '404':
          description: Pagamento não encontrado
        '400':
          description: Erro ao atualizar pagamento
    delete:
      summary: Deletar pagamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Pagamento removido
        '404':
          description: Pagamento não encontrado
        '500':
          description: Erro interno do servidor
