services:
  db:
    image: postgres:16
    container_name: cantinho_dona_maria_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dona_maria_123
      POSTGRES_DB: cantinho_dona_maria

    ports:
      - "5433:5432"

    volumes:
      - dados_postgres:/var/lib/postgresql/data

      # aqui ele coloca tudo no diretorio de entry pra inicializar o banco dom o db e o schema
      - ./schema_dona_maria.sql:/docker-entrypoint-initdb.d/01_schema_dona_maria.sql

  api:
    build: ./api
    container_name: cantinho_dona_maria_api
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: dona_maria_123
      DB_NAME: cantinho_dona_maria
      DB_SCHEMA: dona_maria_schema
    ports:
      - "3000:3000"
    depends_on:
      - db
  app:
    build: ./front-dona-maria
    container_name: front-end_dona_maria
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3000"
    ports:
      - "4000:4000"
    depends_on:
      - api
    
volumes:
  dados_postgres:
    driver: local
